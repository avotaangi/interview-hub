<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис собеседований</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        .container {
            display: flex;
            width: 100%;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        .left-pane {
            width: 30%;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .task h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        .task p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .navigation-buttons button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .navigation-buttons button:hover {
            background-color: #0056b3;
        }

        .navigation-buttons button.disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .right-pane {
            width: 70%;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            height: 100%;
        }

        .editor textarea, .open-question textarea {
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            resize: none;
            background-color: #f9f9f9;
            transition: border 0.3s;
        }

        .editor textarea:focus, .open-question textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .buttons .timer {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
        }

        .buttons button {
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        #run-code {
            background-color: #28a745;
            color: white;
        }

        #submit-code {
            background-color: #dc3545;
            color: white;
        }

        .buttons button:hover {
            opacity: 0.9;
        }

        #run-code:hover {
            background-color: #218838;
        }

        #submit-code:hover {
            background-color: #c82333;
        }

        .options ul {
            list-style-type: none;
            padding: 0;
        }

        .options ul li {
            margin-bottom: 15px;
        }

        .options ul li label {
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .options ul li input[type="radio"] {
            margin-right: 10px;
        }

        .task h2 {
            font-size: 26px;
            font-weight: 600;
            color: #2c3e50;
        }

        .task p {
            font-size: 18px;
            line-height: 1.6;
            color: #7f8c8d;
        }

        .right-pane {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .editor textarea, .open-question textarea {
            height: calc(100vh - 200px);
        }

        .buttons button.disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="left-pane">
        <div class="task">
            <h2 id="task-title">Вопрос с кодом</h2>
            <p id="task-description">
                Напишите функцию, которая принимает массив чисел и возвращает сумму всех положительных чисел.
                Учтите, что массив может быть пустым.
            </p>
        </div>
        <div class="navigation-buttons">
            <button id="prev-task" disabled class="disabled">Предыдущая</button>
            <button id="next-task">Следующая</button>
        </div>
    </div>

    <div class="right-pane">
        <div class="editor" id="editor-pane">
            <textarea id="code-editor" placeholder="Напишите ваш код здесь..."></textarea>
        </div>
        <div class="options" id="options-pane" style="display: none;">
            <ul id="options-list"></ul>
        </div>
        <div class="open-question" id="open-question-pane" style="display: none;">
            <textarea id="open-answer" placeholder="Введите ваш ответ..."></textarea>
        </div>
        <div class="buttons">
            <div class="timer" id="timer">30:00</div>
            <button id="run-code" style="display: none;">Запустить</button>
            <button id="submit-code">Отправить</button>
        </div>
    </div>
</div>

<script>
    const tasks = [
        {
            type: "code",
            title: "Вопрос с кодом",
            description: "Напишите функцию, которая принимает массив чисел и возвращает сумму всех положительных чисел. Учтите, что массив может быть пустым.",
            code: ""
        },
        {
            type: "code",
            title: "Вопрос с кодом",
            description: "Напишите функцию, которая определяет, является ли строка палиндромом. Строка может содержать пробелы и знаки препинания.",
            code: ""
        },
        {
            type: "multiple-choice",
            title: "Вопрос с выбором ответа",
            description: "Какой из следующих типов данных в JavaScript используется для хранения чисел?",
            options: ["String", "Number", "Boolean", "Object"],
            correctOption: 1
        },
        {
            type: "open-question",
            title: "Открытый вопрос",
            description: "Объясните, что такое замыкание в JavaScript и приведите пример.",
            answer: ""
        },
        {
            type: "code",
            title: "Вопрос с кодом",
            description: "Напишите функцию, которая принимает массив строк и возвращает массив строк, отсортированных по длине.",
            code: ""
        }
    ];

    let currentTaskIndex = 0;
    const timerElement = document.getElementById('timer');
    let timeLeft = 30 * 60;

    function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        if (timeLeft > 0) {
            timeLeft--;
        } else {
            clearInterval(timerInterval);
            alert("Время истекло!");
        }
    }

    const timerInterval = setInterval(updateTimer, 1000);

    function updateTask() {
        const task = tasks[currentTaskIndex];
        document.getElementById('task-title').textContent = task.title;
        document.getElementById('task-description').textContent = task.description;

        document.getElementById('editor-pane').style.display = task.type === "code" ? "block" : "none";
        document.getElementById('options-pane').style.display = task.type === "multiple-choice" ? "block" : "none";
        document.getElementById('open-question-pane').style.display = task.type === "open-question" ? "block" : "none";

        if (task.type === "code") {
            document.getElementById('code-editor').value = task.code;
            document.getElementById('run-code').style.display = "inline-block"; // Показываем кнопку
        } else {
            document.getElementById('run-code').style.display = "none"; // Скрываем кнопку
        }

        if (task.type === "multiple-choice") {
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';
            task.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<label><input type="radio" name="option" value="${index}"> ${option}</label>`;
                optionsList.appendChild(li);
            });
        } else if (task.type === "open-question") {
            document.getElementById('open-answer').value = task.answer;
        }

        const prevButton = document.getElementById('prev-task');
        const nextButton = document.getElementById('next-task');
        prevButton.disabled = currentTaskIndex === 0;
        nextButton.disabled = currentTaskIndex === tasks.length - 1;
        prevButton.classList.toggle('disabled', currentTaskIndex === 0);
        nextButton.classList.toggle('disabled', currentTaskIndex === tasks.length - 1);
    }

    function saveTask() {
        const task = tasks[currentTaskIndex];
        if (task.type === "code") {
            task.code = document.getElementById('code-editor').value;
        } else if (task.type === "open-question") {
            task.answer = document.getElementById('open-answer').value;
        }
    }

    document.getElementById('prev-task').addEventListener('click', () => {
        saveTask();
        currentTaskIndex--;
        updateTask();
    });

    document.getElementById('next-task').addEventListener('click', () => {
        saveTask();
        currentTaskIndex++;
        updateTask();
    });

    document.getElementById('run-code').addEventListener('click', () => {
        alert("Код выполнен! Проверьте консоль.");
    });

    document.getElementById('submit-code').addEventListener('click', () => {
        // Показываем всплывающее окно с подтверждением
        const userConfirmed = window.confirm("Вы уверены, что хотите завершить?");

        if (userConfirmed) {
            // Если пользователь согласился, перенаправляем на другую страницу
            window.location.href = "secondpage_candidate.html";
        }
    });

    updateTask();
</script>

</body>
</html>
