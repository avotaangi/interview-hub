<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис собеседований</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'candidate/css/interview_candidate.css' %}">
</head>
<body>

<div class="container">
    <!-- Левая панель с задачами -->
    <div class="left-pane">
        <div class="task">
            <h2 id="task-title"></h2>
            <p id="task-description"></p>
        </div>
        <div class="navigation-buttons">
            <button id="prev-task">Предыдущий</button>
            <button id="next-task">Следующий</button>
        </div>
    </div>

    <!-- Правая панель с редактором и дополнительной информацией -->
    <div class="right-pane">
        <!-- Редактор для заданий с кодом -->
        <div class="editor" id="editor-pane" style="display: none;">
            <textarea id="code-editor" placeholder="Напишите ваш код здесь..."></textarea>
        </div>

        <!-- Блок с тестами для заданий с кодом -->
        <div id="test-cases" style="display: none; margin-top: 20px;">
            <h3>Тесты</h3>
            <ul id="test-cases-list"></ul>
        </div>

        <!-- Варианты ответов для заданий с выбором -->
        <div class="options" id="options-pane" style="display: none;">
            <ul id="options-list">
                <!-- Checkbox для вариантов ответов будет добавляться динамически -->
            </ul>
        </div>

        <!-- Поле для открытого вопроса -->
        <div class="open-question" id="open-question-pane" style="display: none;">
            <textarea id="open-answer" placeholder="Введите ваш ответ..."></textarea>
        </div>

        <!-- Управляющие кнопки -->
        <div class="buttons">
            <div class="timer" id="timer"></div>
            <button id="run-code" style="display: none;">Запустить</button>
            <button id="submit-code">Отправить</button>
        </div>
    </div>
</div>

<script>
    const initialData = {
        duration: {{ duration|safe }},
        tasks: {{ tasks|safe }},
        isEditable: {{ is_editable|yesno:"true,false" }},
    };
</script>
<script src="{% static 'candidate/js/interview_candidate.js' %}"></script>

</body>
</html>
